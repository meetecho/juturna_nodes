name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # until juturna 3.0.0 is on PyPI, the core is installed from its main
      # branch: remove this step once it is published
      - name: Install the juturna core
        run: pip install "juturna @ git+https://github.com/meetecho/juturna@main"

      # heavy optional dependencies are mocked in docs/source/conf.py
      - name: Install dependencies
        run: pip install ".[doc]"

      - name: Build Sphinx
        run: sphinx-build -b html docs/source/ docs/build/html

      - name: Prepare site
        run: |
          mkdir -p site
          touch docs/build/html/.nojekyll
          cp -r docs/build/html site/docs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          enable_jekyll: false
          keep_files: false
