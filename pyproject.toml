[project]
name = "juturna-nodes"
version = "0.1.0"
description = "Officially supported Juturna nodes"
authors = [
    { name = "Antonio Bevilacqua", email = "abevilacqua@meetecho.com" },
    { name = "Paolo Saviano", email = "psaviano@meetecho.com" }
]
maintainers = [
    { name = "Antonio Bevilacqua", email = "b3by.in.th3.sky@gmail.com" },
    { name = "Paolo Saviano", email = "psaviano@meetecho.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "juturna>=3.0.0",
    "requests",
    "websockets",
    "watchdog",
    "pymongo>=4.16.0"
]

[project.optional-dependencies]
av = ["av>=19.0.1"]
warp = ["juturna[warp]"]
audio-ml = ["faster-whisper", "silero-vad"]
vision = ["ultralytics"]

all = ["juturna-nodes[av,warp,audio-ml,vision]"]

doc = [
    "sphinx<9.0,>6.0",
    "sphinx-autoapi==3.8.1",
    "sphinx-autobuild==2025.8.25",
    "sphinxcontrib-apidoc==0.6.0",
    "sphinxcontrib-napoleon==0.7",
    "furo==2025.12.19",
    "sphinx-design==0.7.0",
    "sphinx_new_tab_link==0.8.2"
]
dev = [
    "pre-commit==4.6.2",
    "bandit==1.9.4",
    "conventional-pre-commit==4.4.0"
]
lint = [
    "ruff>= 0.16.10"
]
test = [
    "pytest==9.1.1",
    "pytest-cov"
]

dev_full = [
    "juturna-nodes[doc,dev,lint,test]"
]

[project.urls]
Homepage = "https://github.com/meetecho/juturna_nodes"
Documentation = "https://meetecho.github.io/juturna/index.html"
Repository = "https://github.com/meetecho/juturna_nodes"
Issues = "https://github.com/meetecho/juturna_nodes/issues"
Changelog = "https://github.com/meetecho/juturna_nodes/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/juturna/nodes"]
sources = ["src"]

# development only: resolve juturna from the local checkout until 3.0.0 is
# published (uv ignores this when building the package)
[tool.uv.sources]
juturna = { path = "../juturna_private", editable = true }
